<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Password Updated</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Courier New', Courier, monospace;
                font-size: 13px;
                line-height: 1.5;
                background: #0a0a0a;
                color: #d4d4d4;
                padding: 20px;
            }

            .container {
                max-width: 600px;
                margin: 0 auto;
                background: #1a1a1a;
                border: 1px solid #333;
                padding: 0;
            }

            .header {
                background: #0f0f0f;
                border-bottom: 1px solid #333;
                padding: 16px 20px;
                font-size: 14px;
                font-weight: bold;
                color: #fff;
                text-align: center;
                letter-spacing: 1px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin: 0;
            }

            td {
                padding: 12px 20px;
                border-bottom: 1px solid #2a2a2a;
            }

            .label-cell {
                width: 120px;
                color: #888;
                font-weight: normal;
                vertical-align: top;
            }

            .value-cell {
                color: #fff;
                font-weight: bold;
            }

            .action-row td {
                padding: 20px;
                background: #0f0f0f;
            }

            .action-text {
                color: #aaa;
                margin-bottom: 0;
                font-size: 12px;
            }

            .notice-row td {
                padding: 16px 20px;
                color: #888;
                font-size: 11px;
                border-bottom: none;
            }

            .footer-row td {
                padding: 16px 20px;
                background: #0f0f0f;
                border-top: 1px solid #333;
                color: #666;
                font-size: 10px;
            }

            .footer-label {
                color: #555;
                display: block;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">[ PASSWORD UPDATED ]</div>
            <table>
                <tr>
                    <td class="label-cell">USERNAME</td>
                    <td class="value-cell">{{ username }}</td>
                </tr>
                <tr>
                    <td class="label-cell">EMAIL</td>
                    <td class="value-cell">{{ email }}</td>
                </tr>
                <tr>
                    <td class="label-cell">NAME</td>
                    <td class="value-cell">{{ first_name }} {{ last_name }}</td>
                </tr>
                <tr class="action-row">
                    <td colspan="2">
                        <div class="action-text">Your password has been updated successfully.</div>
                    </td>
                </tr>
                <tr class="notice-row">
                    <td colspan="2">If you did not perform this action, please reset your password immediately and contact support.</td>
                </tr>
                <tr class="footer-row">
                    <td colspan="2">
                        <span class="footer-label">SERVICE</span>
                        {{ app_name }}
                        <br />
                        <br />
                        <span class="footer-label">TIMESTAMP</span>
                        {{ timestamp }}
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
