heartbeat.config.monitors:
    path: /usr/share/heartbeat/monitors.d/*.yml
    reload.enabled: true
    reload.period: 10s

heartbeat.monitors:
    - type: http
      id: elasticsearch-health
      name: Elasticsearch Health Check
      urls: ["http://initstack-elasticsearch-service:9200/_cluster/health"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]
      check.response.body: ["green", "yellow"]
      username: "${ELASTICSEARCH_USERNAME}"
      password: "${ELASTICSEARCH_PASSWORD}"

    - type: http
      id: kibana-health
      name: Kibana Health Check
      urls: ["http://initstack-kibana-service:5601/api/status"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]
      username: "${KIBANA_USERNAME}"
      password: "${KIBANA_PASSWORD}"

    - type: http
      id: redis-exporter-health
      name: Redis Exporter Health Check
      urls: ["http://initstack-redis-exporter-service:9121/metrics"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: elasticsearch-exporter-health
      name: Elasticsearch Exporter Health Check
      urls: ["http://initstack-elasticsearch-exporter-service:9114/metrics"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: postgresql-exporter-health
      name: PostgreSQL Exporter Health Check
      urls: ["http://initstack-postgresql-exporter-service:9187/metrics"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: rabbitmq-management-health
      name: RabbitMQ Management Health Check
      urls: ["http://initstack-rabbitmq-service:15672/api/overview"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]
      username: "${RABBITMQ_USER}"
      password: "${RABBITMQ_PASSWORD}"

    - type: http
      id: consul-health
      name: Consul Health Check
      urls: ["http://initstack-consul-service:8500/v1/status/leader"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: consul-ui-health
      name: Consul UI Health Check
      urls: ["http://initstack-consul-service:8500/ui/"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: consul-exporter-health
      name: Consul Exporter Health Check
      urls: ["http://initstack-consul-exporter-service:9107/metrics"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: apm-health
      name: APM Server Health Check
      urls: ["http://initstack-apm-service:8200/"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-1-docs
      name: FastAPI Service 1 Documentation Health Check
      urls: ["http://initstack-fastapi-service-1:8080/docs"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-1-openapi
      name: FastAPI Service 1 OpenAPI Schema Check
      urls: ["http://initstack-fastapi-service-1:8080/openapi.json"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-1-redoc
      name: FastAPI Service 1 ReDoc Documentation Check
      urls: ["http://initstack-fastapi-service-1:8080/redoc"]
      schedule: "@every 60s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-2-docs
      name: FastAPI Service 2 Documentation Health Check
      urls: ["http://initstack-fastapi-service-2:8080/docs"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-2-openapi
      name: FastAPI Service 2 OpenAPI Schema Check
      urls: ["http://initstack-fastapi-service-2:8080/openapi.json"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-2-redoc
      name: FastAPI Service 2 ReDoc Documentation Check
      urls: ["http://initstack-fastapi-service-2:8080/redoc"]
      schedule: "@every 60s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-3-docs
      name: FastAPI Service 3 Documentation Health Check
      urls: ["http://initstack-fastapi-service-3:8080/docs"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-3-openapi
      name: FastAPI Service 3 OpenAPI Schema Check
      urls: ["http://initstack-fastapi-service-3:8080/openapi.json"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: http
      id: fastapi-3-redoc
      name: FastAPI Service 3 ReDoc Documentation Check
      urls: ["http://initstack-fastapi-service-3:8080/redoc"]
      schedule: "@every 60s"
      timeout: 10s
      check.response.status: [200]

    - type: tcp
      id: redis-tcp
      name: Redis TCP Check
      hosts: ["initstack-redis-service:6379"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: rabbitmq-tcp
      name: RabbitMQ TCP Check
      hosts: ["initstack-rabbitmq-service:5672"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: postgresql-tcp
      name: PostgreSQL TCP Check
      hosts: ["initstack-postgresql-service:5432"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: elasticsearch-tcp
      name: Elasticsearch TCP Check
      hosts: ["initstack-elasticsearch-service:9200"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: kibana-tcp
      name: Kibana TCP Check
      hosts: ["initstack-kibana-service:5601"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: consul-tcp
      name: Consul TCP Check
      hosts: ["initstack-consul-service:8500"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: apm-tcp
      name: APM Server TCP Check
      hosts: ["initstack-apm-service:8200"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: fastapi-1-tcp
      name: FastAPI Service 1 TCP Check
      hosts: ["initstack-fastapi-service-1:8080"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: fastapi-2-tcp
      name: FastAPI Service 2 TCP Check
      hosts: ["initstack-fastapi-service-2:8080"]
      schedule: "@every 30s"
      timeout: 10s

    - type: tcp
      id: fastapi-3-tcp
      name: FastAPI Service 3 TCP Check
      hosts: ["initstack-fastapi-service-3:8080"]
      schedule: "@every 30s"
      timeout: 10s

    - type: http
      id: flower-dashboard
      name: Flower Monitoring Dashboard Check
      urls: ["http://initstack-celery-flower-service:5555/"]
      schedule: "@every 30s"
      timeout: 10s
      check.response.status: [200]

    - type: icmp
      id: docker-network-ping
      name: Docker Network Connectivity
      hosts:
          [
              "initstack-elasticsearch-service",
              "initstack-kibana-service",
              "initstack-consul-service",
              "initstack-postgresql-service",
              "initstack-redis-service",
              "initstack-rabbitmq-service",
              "initstack-apm-service",
              "initstack-fastapi-service-1",
              "initstack-fastapi-service-2",
              "initstack-fastapi-service-3",
              "initstack-celery-worker-1",
              "initstack-celery-worker-2",
              "initstack-celery-worker-3",
              "initstack-celery-beat-1",
              "initstack-celery-beat-2",
              "initstack-celery-beat-3",
              "initstack-celery-flower-service",
          ]
      schedule: "@every 60s"
      timeout: 10s

output.elasticsearch:
    hosts: ["${ELASTICSEARCH_HOSTS}"]
    username: "${ELASTICSEARCH_USERNAME}"
    password: "${ELASTICSEARCH_PASSWORD}"

setup.kibana:
    host: "${KIBANA_HOST}"
    username: "${KIBANA_USERNAME}"
    password: "${KIBANA_PASSWORD}"

setup.template.settings:
    index.number_of_shards: 1
    index.codec: best_compression

setup.ilm.enabled: true
setup.ilm.rollover_alias: "heartbeat"
setup.ilm.pattern: "{now/d}-000001"

monitoring.enabled: ${HEARTBEAT_MONITORING_ENABLED}

http.enabled: true
http.host: 0.0.0.0
http.port: 5065

logging.level: ${HEARTBEAT_LOG_LEVEL}
logging.to_files: true
logging.files:
    path: /var/log/heartbeat
    name: heartbeat
    keepfiles: 7
    permissions: 0644

processors:
    - add_cloud_metadata: ~
    - add_docker_metadata: ~
