global
    log stdout format raw local0
    maxconn ${HAPROXY_MAX_CONNECTIONS}
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect ${HAPROXY_TIMEOUT_CONNECT}ms
    timeout client ${HAPROXY_TIMEOUT_CLIENT}ms
    timeout server ${HAPROXY_TIMEOUT_SERVER}ms
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

frontend stats
    bind *:${HAPROXY_STATS_PORT}
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
    stats admin if TRUE

frontend api_gateway
    bind *:${HAPROXY_API_GATEWAY_PORT}

    acl is_fastapi_api path_beg /api
    acl is_fastapi_docs path_beg /docs
    acl is_fastapi_redoc path_beg /redoc
    acl is_fastapi_openapi path_beg /openapi.json
    acl is_minio path_beg /storage

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

    use_backend fastapi_backend if is_fastapi_api
    use_backend fastapi_backend if is_fastapi_docs
    use_backend fastapi_backend if is_fastapi_redoc
    use_backend fastapi_backend if is_fastapi_openapi
    use_backend minio_backend if is_minio

    default_backend fastapi_backend


backend fastapi_backend
    balance roundrobin
    http-check send meth GET uri /api/v1/health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-check expect string "healthy"
    server fastapi-1 initstack-fastapi-service-1:8080 check inter 10s fall 3 rise 2
    server fastapi-2 initstack-fastapi-service-2:8080 check inter 10s fall 3 rise 2
    server fastapi-3 initstack-fastapi-service-3:8080 check inter 10s fall 3 rise 2

backend minio_backend
    balance roundrobin
    http-request set-path %[path,regsub(^/storage,/)]
    server minio ${HAPROXY_MINIO_BACKEND} check inter 10s fall 3 rise 2
