metricbeat.config.modules:
    path: /usr/share/metricbeat/modules.d/*.yml
    reload.enabled: true
    reload.period: 10s

metricbeat.modules:
    - module: http
      metricsets:
          - json
      period: 10s
      hosts: ["${FLOWER_HOST}:${FLOWER_PORT}"]
      path: "/api/workers"
      namespace: "celery_flower_workers"
      username: "${FLOWER_USERNAME}"
      password: "${FLOWER_PASSWORD}"

    - module: http
      metricsets:
          - json
      period: 10s
      hosts: ["${FLOWER_HOST}:${FLOWER_PORT}"]
      path: "/api/tasks"
      namespace: "celery_flower_tasks"
      username: "${FLOWER_USERNAME}"
      password: "${FLOWER_PASSWORD}"

    - module: system
      metricsets:
          - cpu
          - load
          - memory
          - network
          - process
          - process_summary
          - socket_summary
          - filesystem
          - fsstat
      period: 10s
      processes: [".*"]
      process.include_top_n:
          by_cpu: 5
          by_memory: 5

    - module: docker
      metricsets:
          - container
          - cpu
          - diskio
          - healthcheck
          - info
          - memory
          - network
      period: 10s
      hosts:
          - "unix:///var/run/docker.sock"
      condition:
          or:
              - contains:
                    docker.container.name: "initstack-celery-worker-1"
              - contains:
                    docker.container.name: "initstack-celery-worker-2"
              - contains:
                    docker.container.name: "initstack-celery-worker-3"
              - contains:
                    docker.container.name: "initstack-celery-beat-1"
              - contains:
                    docker.container.name: "initstack-celery-beat-2"
              - contains:
                    docker.container.name: "initstack-celery-beat-3"
              - contains:
                    docker.container.name: "initstack-celery-flower-service"

name: ${METRICBEAT_NAME}
agent.id: ${METRICBEAT_NAME}-${METRICBEAT_FIELDS_DATACENTER}

output.elasticsearch:
    hosts: ["${ELASTICSEARCH_HOSTS}"]
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

setup.kibana:
    host: "${KIBANA_HOST}"
    username: ${KIBANA_USERNAME}
    password: ${KIBANA_PASSWORD}

setup.dashboards.enabled: false

setup.template.settings:
    index.number_of_shards: 1
    index.codec: best_compression

setup.ilm.enabled: true
setup.ilm.rollover_alias: "metricbeat"
setup.ilm.pattern: "{now/d}-000001"

logging.level: ${METRICBEAT_LOG_LEVEL}
logging.to_files: true
logging.files:
    path: /var/log/metricbeat
    name: metricbeat
    keepfiles: 7
    permissions: 0644

monitoring.enabled: ${METRICBEAT_MONITORING_ENABLED}

http.enabled: true
http.host: 0.0.0.0
http.port: 5077

processors:
    - add_host_metadata:
          when.not.contains.tags: forwarded
    - add_cloud_metadata: ~
    - add_docker_metadata: ~
    - add_kubernetes_metadata: ~
