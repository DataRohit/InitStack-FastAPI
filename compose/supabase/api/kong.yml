    - username: service_role
      keyauth_credentials:
          - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NjYwODI2MDAsImV4cCI6MTkyMzg0OTAwMH0.7St5NMvH3gPnbvIl6kqTG56n3YOLqng7AhzHP7kTRDU

