services:
    - name: auth-v1-open
      url: http://initstack-supabase-auth-service:9999/verify
      routes:
          - name: auth-v1-open
            strip_path: true
            paths:
                - /auth/v1/verify
      plugins:
          - name: cors

    - name: auth-v1-open-callback
      url: http://initstack-supabase-auth-service:9999/callback
      routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
                - /auth/v1/callback
      plugins:
          - name: cors

    - name: auth-v1-open-authorize
      url: http://initstack-supabase-auth-service:9999/authorize
      routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
                - /auth/v1/authorize
      plugins:
          - name: cors

    - name: auth-v1
      url: http://initstack-supabase-auth-service:9999/
      routes:
          - name: auth-v1-all
            strip_path: true
            paths:
                - /auth/v1/
      plugins:
          - name: cors
          - name: key-auth
            config:
                hide_credentials: false
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin
                    - anon

    - name: rest-v1
      url: http://initstack-supabase-postgrest-service:3000/
      routes:
          - name: rest-v1-all
            strip_path: true
            paths:
                - /rest/v1/
      plugins:
          - name: cors
          - name: key-auth
            config:
                hide_credentials: true
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin
                    - anon

    - name: graphql-v1
      url: http://initstack-supabase-postgrest-service:3000/rpc/graphql
      routes:
          - name: graphql-v1-all
            strip_path: true
            paths:
                - /graphql/v1
      plugins:
          - name: cors
          - name: key-auth
            config:
                hide_credentials: true
          - name: request-transformer
            config:
                add:
                    headers:
                        - Content-Profile:graphql_public
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin
                    - anon

    - name: realtime-v1-ws
      url: http://initstack-supabase-realtime-service:4000/socket
      protocol: ws
      routes:
          - name: realtime-v1-ws
            strip_path: true
            paths:
                - /realtime/v1/
      plugins:
          - name: cors
          - name: key-auth
            config:
                hide_credentials: false
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin
                    - anon

    - name: realtime-v1-rest
      url: http://initstack-supabase-realtime-service:4000/api
      protocol: http
      routes:
          - name: realtime-v1-rest
            strip_path: true
            paths:
                - /realtime/v1/api
      plugins:
          - name: cors
          - name: key-auth
            config:
                hide_credentials: false
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin
                    - anon

    - name: storage-v1
      url: http://initstack-supabase-storage-service:5000/
      routes:
          - name: storage-v1-all
            strip_path: true
            paths:
                - /storage/v1/
      plugins:
          - name: cors

    - name: functions-v1
      url: http://initstack-supabase-functions-service:9000/
      routes:
          - name: functions-v1-all
            strip_path: true
            paths:
                - /functions/v1/
      plugins:
          - name: cors

    - name: analytics-v1
      url: http://initstack-supabase-analytics-service:4000/
      routes:
          - name: analytics-v1-all
            strip_path: true
            paths:
                - /analytics/v1/

    - name: meta
      url: http://initstack-supabase-postgres-meta-service:8080/
      routes:
          - name: meta-all
            strip_path: true
            paths:
                - /pg/
      plugins:
          - name: key-auth
            config:
                hide_credentials: false
          - name: acl
            config:
                hide_groups_header: true
                allow:
                    - admin

    - name: mcp-blocker
      url: http://initstack-supabase-studio-service:3000/api/mcp
      routes:
          - name: mcp-blocker-route
            strip_path: true
            paths:
                - /api/mcp
      plugins:
          - name: request-termination
            config:
                status_code: 403
                message: "Access is forbidden."

    - name: mcp
      url: http://initstack-supabase-studio-service:3000/api/mcp
      routes:
          - name: mcp
            strip_path: true
            paths:
                - /mcp
      plugins:
          - name: request-termination
            config:
                status_code: 403
                message: "Access is forbidden."

    - name: dashboard
      url: http://initstack-supabase-studio-service:3000/
      routes:
          - name: dashboard-all
            strip_path: true
            paths:
                - /
      plugins:
          - name: cors
          - name: basic-auth
            config:
                hide_credentials: true
