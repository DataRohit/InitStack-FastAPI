groups:
    - name: service_availability
      interval: 30s
      rules:
          - alert: ServiceDown
            expr: up == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Service {{ $labels.job }} is down"
                description: "{{ $labels.job }} at {{ $labels.instance }} has been down for more than 5 minutes."

    - name: redis_exporter
      interval: 30s
      rules:
          - alert: RedisExporterDown
            expr: up{job="redis-exporter"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Redis Exporter is down"
                description: "Redis exporter has been down for more than 5 minutes."

          - alert: RedisHighMemoryUsage
            expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: "Redis high memory usage"
                description: "Redis memory usage is above 90% (current: {{ $value }}%)"

          - alert: RedisRejectedConnections
            expr: increase(redis_rejected_connections_total[5m]) > 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Redis rejecting connections"
                description: "Redis is rejecting connections"

    - name: postgresql_exporter
      interval: 30s
      rules:
          - alert: PostgreSQLExporterDown
            expr: up{job="postgresql-exporter"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "PostgreSQL Exporter is down"
                description: "PostgreSQL exporter has been down for more than 5 minutes."

          - alert: PostgreSQLTooManyConnections
            expr: sum(pg_stat_activity_count) > (pg_settings_max_connections * 0.8)
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "PostgreSQL too many connections"
                description: "PostgreSQL is using more than 80% of max connections (current: {{ $value }})"

          - alert: PostgreSQLDeadLocks
            expr: increase(pg_stat_database_deadlocks[5m]) > 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "PostgreSQL deadlocks detected"
                description: "PostgreSQL has detected deadlocks"

    - name: rabbitmq_metrics
      interval: 30s
      rules:
          - alert: RabbitMQDown
            expr: up{job="rabbitmq"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "RabbitMQ is down"
                description: "RabbitMQ has been down for more than 5 minutes."

          - alert: RabbitMQTooManyConnections
            expr: rabbitmq_connections > 1000
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "RabbitMQ too many connections"
                description: "RabbitMQ has more than 1000 connections (current: {{ $value }})"

          - alert: RabbitMQHighQueueMessages
            expr: sum(rabbitmq_queue_messages) by (queue) > 10000
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: "RabbitMQ high queue messages"
                description: "Queue {{ $labels.queue }} has more than 10000 messages (current: {{ $value }})"

    - name: elasticsearch_exporter
      interval: 30s
      rules:
          - alert: ElasticsearchExporterDown
            expr: up{job="elasticsearch-exporter"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Elasticsearch Exporter is down"
                description: "Elasticsearch exporter has been down for more than 5 minutes."

          - alert: ElasticsearchClusterRed
            expr: elasticsearch_cluster_health_status{color="red"} == 1
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Elasticsearch cluster status is RED"
                description: "Elasticsearch cluster status is RED"

          - alert: ElasticsearchClusterYellow
            expr: elasticsearch_cluster_health_status{color="yellow"} == 1
            for: 15m
            labels:
                severity: warning
            annotations:
                summary: "Elasticsearch cluster status is YELLOW"
                description: "Elasticsearch cluster status is YELLOW for more than 15 minutes"

    - name: fastapi_services
      interval: 30s
      rules:
          - alert: FastAPIServiceDown
            expr: up{job=~"fastapi-service-.*"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "FastAPI service is down"
                description: "FastAPI {{ $labels.job }} has been down for more than 5 minutes."

          - alert: FastAPIHighResponseTime
            expr: histogram_quantile(0.95, rate(http_server_request_duration_bucket[5m])) > 2
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: "FastAPI high response time"
                description: "FastAPI 95th percentile response time is above 2s (current: {{ $value }}s)"

          - alert: FastAPIHighErrorRate
            expr: sum(rate(http_server_request_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_count[5m])) > 0.05
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "FastAPI high error rate"
                description: "FastAPI has high 5xx error rate (current: {{ $value }})"

    - name: consul_exporter
      interval: 30s
      rules:
          - alert: ConsulExporterDown
            expr: up{job="consul-exporter"} == 0
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Consul Exporter is down"
                description: "Consul exporter has been down for more than 5 minutes."

          - alert: ConsulServiceUnhealthy
            expr: consul_health_service_status{status="critical"} > 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Consul service unhealthy"
                description: "Consul service {{ $labels.service_name }} is in critical state"

    - name: celery_monitoring
      interval: 30s
      rules:
          - alert: CeleryFlowerDown
            expr: up{job="celery-flower"} == 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Celery Flower is down"
                description: "Celery Flower monitoring has been down for more than 5 minutes."

    - name: prometheus_self
      interval: 30s
      rules:
          - alert: PrometheusConfigReloadFailed
            expr: prometheus_config_last_reload_successful == 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Prometheus config reload failed"
                description: "Prometheus configuration reload has failed"

          - alert: PrometheusTSDBCompactionsFailed
            expr: increase(prometheus_tsdb_compactions_failed_total[5m]) > 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Prometheus TSDB compactions failed"
                description: "Prometheus TSDB compactions are failing"
