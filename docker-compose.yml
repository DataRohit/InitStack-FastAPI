            - .envs/haproxy/.env
        volumes:
            - ./compose/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
            - ./compose/haproxy/start-haproxy.sh:/usr/local/bin/start-haproxy.sh:ro
