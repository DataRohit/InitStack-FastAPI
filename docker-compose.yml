services:
    initstack-postgres-service:
        image: postgres:18.1
        container_name: initstack-postgres-service
        restart: unless-stopped
        env_file:
            - .envs/postgres/.env
        volumes:
            - initstack-postgres-data:/var/lib/postgresql
            - ./compose/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./compose/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
            - ./compose/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
            - ./compose/postgres/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5432:5432"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-postgres-exporter-service:
        image: prometheuscommunity/postgres-exporter:v0.18.1
        container_name: initstack-postgres-exporter-service
        entrypoint: ["/usr/local/bin/start-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/postgres-exporter/.env
        volumes:
            - ./compose/postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
            - ./compose/postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
            - ./compose/postgres-exporter/start-exporter.sh:/usr/local/bin/start-exporter.sh:ro
            - ./compose/postgres-exporter/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9187:9187"
        networks:
            - initstack-network
        depends_on:
            initstack-postgres-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-redis-service:
        image: redis:8.4.0
        container_name: initstack-redis-service
        entrypoint: ["/usr/local/bin/start-redis.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis/.env
        volumes:
            - initstack-redis-data:/data
            - ./compose/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
            - ./compose/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
            - ./compose/redis/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "6379:6379"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-sonarqube-service:
        image: sonarqube:25.12.0.117093-community
        container_name: initstack-sonarqube-service
        user: "1000:1000"
        entrypoint: ["/usr/local/bin/start-sonarqube.sh"]
        restart: unless-stopped
        env_file:
            - .envs/sonarqube/.env
        volumes:
            - initstack-sonarqube-data:/opt/sonarqube/data
            - initstack-sonarqube-logs:/opt/sonarqube/logs
            - initstack-sonarqube-temp:/opt/sonarqube/temp
            - initstack-sonarqube-extensions:/opt/sonarqube/extensions
            - ./compose/sonarqube/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro
            - ./compose/sonarqube/start-sonarqube.sh:/usr/local/bin/start-sonarqube.sh:ro
            - ./compose/sonarqube/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9000:9000"
        networks:
            - initstack-network
        depends_on:
            initstack-postgres-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 60s
            timeout: 30s
            retries: 5
            start_period: 120s
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 131072
                hard: 131072
            nproc: 8192

volumes:
    initstack-postgres-data:
        name: initstack-postgres-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-postgres-data"
            - "environment=development"

    initstack-redis-data:
        name: initstack-redis-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-redis-data"
            - "environment=development"

    initstack-sonarqube-data:
        name: initstack-sonarqube-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-data"
            - "environment=development"
    initstack-sonarqube-logs:
        name: initstack-sonarqube-logs
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-logs"
            - "environment=development"
    initstack-sonarqube-temp:
        name: initstack-sonarqube-temp
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-temp"
            - "environment=development"
    initstack-sonarqube-extensions:
        name: initstack-sonarqube-extensions
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-extensions"
            - "environment=development"

networks:
    initstack-network:
        name: initstack-network
        driver: bridge
        labels:
            - "com.docker.compose.network=initstack-network"
            - "environment=development"
            - "project=local-dev"
