            - ./compose/fastapi-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/fastapi-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/fastapi-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5076:5076"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-fastapi-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

volumes:
    initstack-consul-data:
        name: initstack-consul-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-consul-data"
            - "environment=development"

    initstack-redis-data:
        name: initstack-redis-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-redis-data"
            - "environment=development"

    initstack-rabbitmq-data:
        name: initstack-rabbitmq-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-rabbitmq-data"
            - "environment=development"

    initstack-elasticsearch-data:
        name: initstack-elasticsearch-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-elasticsearch-data"
            - "environment=development"

    initstack-kibana-data:
        name: initstack-kibana-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-kibana-data"
            - "environment=development"

    initstack-filebeat-data:
        name: initstack-filebeat-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-filebeat-data"
            - "environment=development"

    initstack-apm-data:
        name: initstack-apm-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-apm-data"
            - "environment=development"

    initstack-heartbeat-data:
        name: initstack-heartbeat-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-heartbeat-data"
            - "environment=development"

    initstack-consul-metricbeat-data:
        name: initstack-consul-metricbeat-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-consul-metricbeat-data"
            - "environment=development"

    initstack-redis-metricbeat-data:
        name: initstack-redis-metricbeat-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-redis-metricbeat-data"
