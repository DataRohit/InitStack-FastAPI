services:
    initstack-postgres-service:
        image: postgres:18.1
        container_name: initstack-postgres-service
        restart: unless-stopped
        env_file:
            - .envs/postgres/.env
        volumes:
            - initstack-postgres-data:/var/lib/postgresql
            - ./compose/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./compose/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
            - ./compose/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
            - ./compose/postgres/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5432:5432"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-postgres-exporter-service:
        image: prometheuscommunity/postgres-exporter:v0.18.1
        container_name: initstack-postgres-exporter-service
        entrypoint: ["/usr/local/bin/start-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/postgres-exporter/.env
        volumes:
            - ./compose/postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
            - ./compose/postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
            - ./compose/postgres-exporter/start-exporter.sh:/usr/local/bin/start-exporter.sh:ro
            - ./compose/postgres-exporter/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9187:9187"
        networks:
            - initstack-network
        depends_on:
            initstack-postgres-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-redis-service:
        image: redis:8.4.0
        container_name: initstack-redis-service
        entrypoint: ["/usr/local/bin/start-redis.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis/.env
        volumes:
            - initstack-redis-data:/data
            - ./compose/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
            - ./compose/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
            - ./compose/redis/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "6379:6379"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-redis-exporter-service:
        image: oliver006/redis_exporter:v1.80.1-alpine
        container_name: initstack-redis-exporter-service
        entrypoint: ["/usr/local/bin/start-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis-exporter/.env
        volumes:
            - ./compose/redis-exporter/start-exporter.sh:/usr/local/bin/start-exporter.sh:ro
            - ./compose/redis-exporter/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9121:9121"
        networks:
            - initstack-network
        depends_on:
            initstack-redis-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-rabbitmq-service:
        image: rabbitmq:4.2.1-management
        container_name: initstack-rabbitmq-service
        hostname: initstack-rabbitmq
        entrypoint: ["/usr/local/bin/start-rabbitmq.sh"]
        restart: unless-stopped
        env_file:
            - .envs/rabbitmq/.env
        volumes:
            - initstack-rabbitmq-data:/var/lib/rabbitmq
            - ./compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
            - ./compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
            - ./compose/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
            - ./compose/rabbitmq/start-rabbitmq.sh:/usr/local/bin/start-rabbitmq.sh:ro
            - ./compose/rabbitmq/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-elasticsearch-service:
        image: elasticsearch:8.19.8
        container_name: initstack-elasticsearch-service
        entrypoint: ["/usr/local/bin/start-elasticsearch.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch/.env
        volumes:
            - initstack-elasticsearch-data:/usr/share/elasticsearch/data
            - ./compose/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
            - ./compose/elasticsearch/jvm.options:/usr/share/elasticsearch/config/jvm.options:ro
            - ./compose/elasticsearch/start-elasticsearch.sh:/usr/local/bin/start-elasticsearch.sh:ro
            - ./compose/elasticsearch/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9200:9200"
            - "9300:9300"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536

    initstack-elasticsearch-exporter-service:
        image: prometheuscommunity/elasticsearch-exporter:v1.10.0
        container_name: initstack-elasticsearch-exporter-service
        entrypoint: ["/bin/sh", "/start-elasticsearch-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch-exporter/.env
        volumes:
            - ./compose/elasticsearch-exporter/start-elasticsearch-exporter.sh:/start-elasticsearch-exporter.sh:ro
            - ./compose/elasticsearch-exporter/healthcheck.sh:/healthcheck.sh:ro
        ports:
            - "9114:9114"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-kibana-service:
        image: kibana:8.19.8
        container_name: initstack-kibana-service
        entrypoint: ["/usr/local/bin/start-kibana.sh"]
        restart: unless-stopped
        env_file:
            - .envs/kibana/.env
        volumes:
            - initstack-kibana-data:/usr/share/kibana/data
            - ./compose/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
            - ./compose/kibana/start-kibana.sh:/usr/local/bin/start-kibana.sh:ro
            - ./compose/kibana/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5601:5601"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s

    initstack-sonarqube-service:
        image: sonarqube:25.12.0.117093-community
        container_name: initstack-sonarqube-service
        user: "1000:1000"
        entrypoint: ["/usr/local/bin/start-sonarqube.sh"]
        restart: unless-stopped
        env_file:
            - .envs/sonarqube/.env
        volumes:
            - initstack-sonarqube-data:/opt/sonarqube/data
            - initstack-sonarqube-logs:/opt/sonarqube/logs
            - initstack-sonarqube-temp:/opt/sonarqube/temp
            - initstack-sonarqube-extensions:/opt/sonarqube/extensions
            - ./compose/sonarqube/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro
            - ./compose/sonarqube/start-sonarqube.sh:/usr/local/bin/start-sonarqube.sh:ro
            - ./compose/sonarqube/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9000:9000"
        networks:
            - initstack-network
        depends_on:
            initstack-postgres-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 60s
            timeout: 30s
            retries: 5
            start_period: 120s
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 131072
                hard: 131072
            nproc: 8192

volumes:
    initstack-postgres-data:
        name: initstack-postgres-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-postgres-data"
            - "environment=development"

    initstack-redis-data:
        name: initstack-redis-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-redis-data"
            - "environment=development"

    initstack-rabbitmq-data:
        name: initstack-rabbitmq-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-rabbitmq-data"
            - "environment=development"

    initstack-elasticsearch-data:
        name: initstack-elasticsearch-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-elasticsearch-data"
            - "environment=development"

    initstack-kibana-data:
        name: initstack-kibana-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-kibana-data"
            - "environment=development"

    initstack-sonarqube-data:
        name: initstack-sonarqube-data
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-data"
            - "environment=development"
    initstack-sonarqube-logs:
        name: initstack-sonarqube-logs
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-logs"
            - "environment=development"
    initstack-sonarqube-temp:
        name: initstack-sonarqube-temp
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-temp"
            - "environment=development"
    initstack-sonarqube-extensions:
        name: initstack-sonarqube-extensions
        driver: local
        labels:
            - "com.docker.compose.volume=initstack-sonarqube-extensions"
            - "environment=development"

networks:
    initstack-network:
        name: initstack-network
        driver: bridge
        labels:
            - "com.docker.compose.network=initstack-network"
            - "environment=development"
            - "project=local-dev"
