services:
    initstack-consul-service:
        image: consul:1.15.4
        container_name: initstack-consul-service
        user: root
        entrypoint: ["/start-consul.sh"]
        restart: unless-stopped
        env_file:
            - .envs/consul/.env
        volumes:
            - initstack-consul-data:/consul/data
            - ./compose/consul/consul.hcl:/consul/config/consul.hcl:ro
            - ./compose/consul/start-consul.sh:/start-consul.sh:ro
            - ./compose/consul/healthcheck.sh:/healthcheck.sh:ro
        ports:
            - "8500:8500"
            - "8600:8600/tcp"
            - "8600:8600/udp"
            - "8301:8301"
            - "8302:8302"
            - "8300:8300"
            - "8502:8502"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-consul-exporter-service:
        image: prom/consul-exporter:v0.13.0
        container_name: initstack-consul-exporter-service
        user: root
        entrypoint: ["/start-consul-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/consul-exporter/.env
        volumes:
            - ./compose/consul-exporter/start-consul-exporter.sh:/start-consul-exporter.sh:ro
        ports:
            - "9107:9107"
        networks:
            - initstack-network
        depends_on:
            initstack-consul-service:
                condition: service_healthy

    initstack-redis-service:
        image: redis:8.4.0
        container_name: initstack-redis-service
        entrypoint: ["/usr/local/bin/start-redis.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis/.env
        volumes:
            - initstack-redis-data:/data
            - ./compose/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
            - ./compose/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
            - ./compose/redis/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "6379:6379"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-redis-exporter-service:
        image: oliver006/redis_exporter:v1.80.1-alpine
        container_name: initstack-redis-exporter-service
        entrypoint: ["/usr/local/bin/start-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis-exporter/.env
        volumes:
            - ./compose/redis-exporter/start-exporter.sh:/usr/local/bin/start-exporter.sh:ro
        ports:
            - "9121:9121"
        networks:
            - initstack-network
        depends_on:
            initstack-redis-service:
                condition: service_healthy

    initstack-rabbitmq-service:
        image: rabbitmq:4.2.1-management
        container_name: initstack-rabbitmq-service
        hostname: initstack-rabbitmq
        entrypoint: ["/usr/local/bin/start-rabbitmq.sh"]
        restart: unless-stopped
        env_file:
            - .envs/rabbitmq/.env
        volumes:
            - initstack-rabbitmq-data:/var/lib/rabbitmq
            - ./compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
            - ./compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
            - ./compose/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
            - ./compose/rabbitmq/start-rabbitmq.sh:/usr/local/bin/start-rabbitmq.sh:ro
            - ./compose/rabbitmq/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-elasticsearch-service:
        image: elasticsearch:8.19.8
        container_name: initstack-elasticsearch-service
        entrypoint: ["/usr/local/bin/start-elasticsearch.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch/.env
        volumes:
            - initstack-elasticsearch-data:/usr/share/elasticsearch/data
            - ./compose/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
            - ./compose/elasticsearch/jvm.options:/usr/share/elasticsearch/config/jvm.options:ro
            - ./compose/elasticsearch/start-elasticsearch.sh:/usr/local/bin/start-elasticsearch.sh:ro
            - ./compose/elasticsearch/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9200:9200"
            - "9300:9300"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536

    initstack-elasticsearch-exporter-service:
        image: prometheuscommunity/elasticsearch-exporter:v1.10.0
        container_name: initstack-elasticsearch-exporter-service
        entrypoint: ["/bin/sh", "/start-elasticsearch-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch-exporter/.env
        volumes:
            - ./compose/elasticsearch-exporter/start-elasticsearch-exporter.sh:/start-elasticsearch-exporter.sh:ro
        ports:
            - "9114:9114"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy

    initstack-kibana-service:
        image: kibana:8.19.8
        container_name: initstack-kibana-service
        entrypoint: ["/usr/local/bin/start-kibana.sh"]
        restart: unless-stopped
        env_file:
            - .envs/kibana/.env
        volumes:
            - initstack-kibana-data:/usr/share/kibana/data
            - ./compose/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
            - ./compose/kibana/start-kibana.sh:/usr/local/bin/start-kibana.sh:ro
            - ./compose/kibana/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5601:5601"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s

    initstack-fastapi-service:
        build:
            context: .
            dockerfile: dockerfile
        image: initstack-fastapi-service:latest
        container_name: initstack-fastapi-service
        restart: unless-stopped
        depends_on:
            initstack-consul-service:
                condition: service_healthy
            initstack-redis-service:
                condition: service_healthy
            initstack-rabbitmq-service:
                condition: service_healthy
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-apm-service:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - .:/app
            - ./healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "8000:8000"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-filebeat-service:
        image: elastic/filebeat:8.19.8
        container_name: initstack-filebeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-filebeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/filebeat/.env
        volumes:
            - initstack-filebeat-data:/usr/share/filebeat/data
            - ./compose/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - ./compose/filebeat/start-filebeat.sh:/usr/local/bin/start-filebeat.sh:ro
            - ./compose/filebeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        ports:
            - "5066:5066"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-apm-service:
        image: elastic/apm-server:8.19.8
        container_name: initstack-apm-service
        user: root
        entrypoint: ["/usr/local/bin/start-apm-server.sh"]
        restart: unless-stopped
        env_file:
            - .envs/apm/.env
        volumes:
            - initstack-apm-data:/usr/share/apm-server/data
            - ./compose/apm/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
            - ./compose/apm/start-apm-server.sh:/usr/local/bin/start-apm-server.sh:ro
            - ./compose/apm/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        ports:
            - "8200:8200"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s

    initstack-heartbeat-service:
        image: elastic/heartbeat:8.19.8
        container_name: initstack-heartbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-heartbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/heartbeat/.env
        volumes:
            - initstack-heartbeat-data:/usr/share/heartbeat/data
            - ./compose/heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
            - ./compose/heartbeat/start-heartbeat.sh:/usr/local/bin/start-heartbeat.sh:ro
            - ./compose/heartbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5065:5065"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        cap_add:
            - NET_RAW

    initstack-consul-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-consul-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/consul-metricbeat/.env
        volumes:
            - initstack-consul-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/consul-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/consul-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/consul-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5067:5067"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-consul-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-redis-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-redis-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis-metricbeat/.env
        volumes:
            - initstack-redis-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/redis-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/redis-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/redis-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5069:5069"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-redis-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-rabbitmq-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-rabbitmq-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/rabbitmq-metricbeat/.env
        volumes:
            - initstack-rabbitmq-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/rabbitmq-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/rabbitmq-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/rabbitmq-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5070:5070"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-rabbitmq-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-elasticsearch-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-elasticsearch-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch-metricbeat/.env
        volumes:
            - initstack-elasticsearch-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/elasticsearch-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/elasticsearch-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/elasticsearch-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5071:5071"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-kibana-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-kibana-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/kibana-metricbeat/.env
        volumes:
            - initstack-kibana-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/kibana-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/kibana-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/kibana-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5072:5072"
        networks:
