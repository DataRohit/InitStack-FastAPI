services:
    initstack-consul-service:
        image: consul:1.15.4
        container_name: initstack-consul-service
        user: root
        entrypoint: ["/start-consul.sh"]
        restart: unless-stopped
        env_file:
            - .envs/consul/.env
        volumes:
            - initstack-consul-data:/consul/data
            - ./compose/consul/consul.hcl:/consul/config/consul.hcl:ro
            - ./compose/consul/start-consul.sh:/start-consul.sh:ro
            - ./compose/consul/healthcheck.sh:/healthcheck.sh:ro
        ports:
            - "8500:8500"
            - "8600:8600/tcp"
            - "8600:8600/udp"
            - "8301:8301"
            - "8302:8302"
            - "8300:8300"
            - "8502:8502"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-consul-exporter-service:
        image: prom/consul-exporter:v0.13.0
        container_name: initstack-consul-exporter-service
        user: root
        entrypoint: ["/start-consul-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/consul-exporter/.env
        volumes:
            - ./compose/consul-exporter/start-consul-exporter.sh:/start-consul-exporter.sh:ro
        ports:
            - "9107:9107"
        networks:
            - initstack-network
        depends_on:
            initstack-consul-service:
                condition: service_healthy

    initstack-redis-service:
        image: redis:8.4.0
        container_name: initstack-redis-service
        entrypoint: ["/usr/local/bin/start-redis.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis/.env
        volumes:
            - initstack-redis-data:/data
            - ./compose/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
            - ./compose/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
            - ./compose/redis/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "6379:6379"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-redis-exporter-service:
        image: oliver006/redis_exporter:v1.80.1-alpine
        container_name: initstack-redis-exporter-service
        entrypoint: ["/usr/local/bin/start-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/redis-exporter/.env
        volumes:
            - ./compose/redis-exporter/start-exporter.sh:/usr/local/bin/start-exporter.sh:ro
        ports:
            - "9121:9121"
        networks:
            - initstack-network
        depends_on:
            initstack-redis-service:
                condition: service_healthy

    initstack-rabbitmq-service:
        image: rabbitmq:4.2.1-management
        container_name: initstack-rabbitmq-service
        hostname: initstack-rabbitmq
        entrypoint: ["/usr/local/bin/start-rabbitmq.sh"]
        restart: unless-stopped
        env_file:
            - .envs/rabbitmq/.env
        volumes:
            - initstack-rabbitmq-data:/var/lib/rabbitmq
            - ./compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
            - ./compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
            - ./compose/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
            - ./compose/rabbitmq/start-rabbitmq.sh:/usr/local/bin/start-rabbitmq.sh:ro
            - ./compose/rabbitmq/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-postgresql-service:
        image: postgres:18.1
        container_name: initstack-postgresql-service
        entrypoint: ["/usr/local/bin/start-postgresql.sh"]
        restart: unless-stopped
        env_file:
            - .envs/postgresql/.env
        volumes:
            - initstack-postgresql-data:/var/lib/postgresql
            - ./compose/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./compose/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
            - ./compose/postgresql/start-postgresql.sh:/usr/local/bin/start-postgresql.sh:ro
            - ./compose/postgresql/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - ./compose/postgresql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        ports:
            - "5432:5432"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        shm_size: 256mb

    initstack-postgresql-exporter-service:
        image: prometheuscommunity/postgres-exporter:v0.18.1
        container_name: initstack-postgresql-exporter-service
        user: root
        entrypoint: ["/bin/sh", "/start-postgresql-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/postgresql-exporter/.env
        volumes:
            - ./compose/postgresql-exporter/start-postgresql-exporter.sh:/start-postgresql-exporter.sh:ro
        ports:
            - "9187:9187"
        networks:
            - initstack-network
        depends_on:
            initstack-postgresql-service:
                condition: service_healthy

    initstack-mailpit-service:
        image: axllent/mailpit:v1.22.3
        container_name: initstack-mailpit-service
        entrypoint: ["/usr/local/bin/start-mailpit.sh"]
        restart: unless-stopped
        env_file:
            - .envs/mailpit/.env
        volumes:
            - ./compose/mailpit/start-mailpit.sh:/usr/local/bin/start-mailpit.sh:ro
            - ./compose/mailpit/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    initstack-minio-service:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        container_name: initstack-minio-service
        entrypoint: ["/usr/local/bin/start-minio.sh"]
        restart: unless-stopped
        env_file:
            - .envs/minio/.env
        volumes:
            - initstack-minio-data:/data
            - ./compose/minio/start-minio.sh:/usr/local/bin/start-minio.sh:ro
            - ./compose/minio/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9001:9001"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    initstack-elasticsearch-service:
        image: elasticsearch:8.19.8
        container_name: initstack-elasticsearch-service
        entrypoint: ["/usr/local/bin/start-elasticsearch.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch/.env
        volumes:
            - initstack-elasticsearch-data:/usr/share/elasticsearch/data
            - ./compose/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
            - ./compose/elasticsearch/jvm.options:/usr/share/elasticsearch/config/jvm.options:ro
            - ./compose/elasticsearch/start-elasticsearch.sh:/usr/local/bin/start-elasticsearch.sh:ro
            - ./compose/elasticsearch/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        ports:
            - "9200:9200"
            - "9300:9300"
        networks:
            - initstack-network
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536

    initstack-elasticsearch-exporter-service:
        image: prometheuscommunity/elasticsearch-exporter:v1.10.0
        container_name: initstack-elasticsearch-exporter-service
        entrypoint: ["/bin/sh", "/start-elasticsearch-exporter.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticsearch-exporter/.env
        volumes:
            - ./compose/elasticsearch-exporter/start-elasticsearch-exporter.sh:/start-elasticsearch-exporter.sh:ro
        ports:
            - "9114:9114"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy

    initstack-kibana-service:
        image: kibana:8.19.8
        container_name: initstack-kibana-service
        entrypoint: ["/usr/local/bin/start-kibana.sh"]
        restart: unless-stopped
        env_file:
