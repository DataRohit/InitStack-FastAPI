        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-exporters-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-exporters-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/exporters-metricbeat/.env
        volumes:
            - initstack-exporters-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/exporters-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/exporters-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/exporters-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5074:5074"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-consul-exporter-service:
                condition: service_started
            initstack-redis-exporter-service:
                condition: service_started
            initstack-elasticsearch-exporter-service:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-elasticstack-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-elasticstack-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/elasticstack-metricbeat/.env
        volumes:
            - initstack-elasticstack-metricbeat-data:/usr/share/metricbeat/data
            - ./compose/elasticstack-metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - ./compose/elasticstack-metricbeat/start-metricbeat.sh:/usr/local/bin/start-metricbeat.sh:ro
            - ./compose/elasticstack-metricbeat/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
            - /proc:/hostfs/proc:ro
            - /:/hostfs:ro
        ports:
            - "5075:5075"
        networks:
            - initstack-network
        depends_on:
            initstack-elasticsearch-service:
                condition: service_healthy
            initstack-kibana-service:
                condition: service_healthy
            initstack-filebeat-service:
                condition: service_healthy
            initstack-apm-service:
                condition: service_healthy
            initstack-heartbeat-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    initstack-fastapi-metricbeat-service:
        image: elastic/metricbeat:8.19.8
        container_name: initstack-fastapi-metricbeat-service
        user: root
        entrypoint: ["/usr/local/bin/start-metricbeat.sh"]
        restart: unless-stopped
        env_file:
            - .envs/fastapi-metricbeat/.env
        volumes:
